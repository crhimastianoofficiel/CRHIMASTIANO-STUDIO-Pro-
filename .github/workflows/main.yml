name: Generate Gradle Wrapper 8.9

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-wrapper:
    name: Generate and commit Gradle Wrapper
    runs-on: ubuntu-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate standard Gradle Wrapper
        run: gradle --no-daemon wrapper --gradle-version 8.9 --distribution-type bin

      - name: Verify generated Wrapper files
        run: |
          test -s gradlew
          test -s gradlew.bat
          test -s gradle/wrapper/gradle-wrapper.jar
          test -s gradle/wrapper/gradle-wrapper.properties
          grep -F 'gradle-8.9-bin.zip' gradle/wrapper/gradle-wrapper.properties
          chmod +x gradlew

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Commit and push Wrapper to main
        run: |
          git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
          if git diff --cached --quiet; then
            echo "::error::No Wrapper changes to commit."
            exit 1
          fi
          git commit -m "Add standard Gradle 8.9 wrapper"
          git push origin HEAD:main
